# ==============================================================================
# WEB APP CONNECTION CONFIGURATION
# ==============================================================================
# Configure the URL loaded by the Android application:
#
# 1. "local" (Default)
#    Loads bundled local assets from APK (assets/www/index.html).
#    Works standalone & offline with direct Supabase cloud sync!
#
# 2. "http://10.0.2.2:3000"
#    Standard Android Emulator accessing host PC's local server (npm start).
#
# 3. "http://<YOUR_PC_IP>:3000" (e.g. http://192.168.1.15:3000)
#    Physical Android phone on the same local Wi-Fi network.
#
# 4. "https://your-production-domain.com"
#    Hosted production web deployment.
# ==============================================================================
WEB_APP_URL=local
