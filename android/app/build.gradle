plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.leadtracker.careertracker'
    compileSdk 35

    defaultConfig {
        applicationId "com.leadtracker.careertracker"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def webAppUrl = project.findProperty("WEB_APP_URL") ?: "local"
        buildConfigField "String", "WEB_APP_URL", "\"${webAppUrl}\""
        resValue "string", "web_app_url", "${webAppUrl}"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            // Default Android debug keystore
        }
        release {
            // Configure default debug signing for release if no release keystore is provided,
            // allowing `./gradlew assembleRelease` to succeed out-of-the-box.
            def debugSigning = signingConfigs.debug
            storeFile debugSigning.storeFile
            storePassword debugSigning.storePassword
            keyAlias debugSigning.keyAlias
            keyPassword debugSigning.keyPassword
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
}
